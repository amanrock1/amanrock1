name: Update merged PRs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh search prs --author amanrock1 --merged --limit 100 \
            --json repository,title,url,number,closedAt \
            --jq '[.[] | select(.repository.nameWithOwner | startswith("amanrock1/") | not)] | sort_by(.closedAt) | reverse | .[] | "| [\(.repository.nameWithOwner)](https://github.com/\(.repository.nameWithOwner)) | \(.title) | [#\(.number)](\(.url)) | \(.closedAt[0:10]) |"' > rows.txt

      - name: Update README
        run: |
          python3 - <<'EOF'
          import re
          rows = open('rows.txt').read().strip()
          if rows:
              table = "| Project | Contribution | PR | Merged |\n|---|---|---|---|\n" + rows
          else:
              table = "_Nothing merged yet._"
          text = open('README.md').read()
          new = re.sub(r'(<!-- OSS:START -->).*?(<!-- OSS:END -->)',
                       lambda m: m.group(1) + "\n" + table + "\n" + m.group(2),
                       text, flags=re.S)
          open('README.md', 'w').write(new)
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update merged PRs" && git push)
